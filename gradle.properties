# =============================================================================
# AudioBook — Gradle properties
# =============================================================================
# File này chứa cấu hình cho Gradle daemon, Android Gradle Plugin (AGP),
# Kotlin compiler và R8. Đây là cấu hình chuẩn cho project production.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Gradle Daemon — JVM args
# -----------------------------------------------------------------------------
# Cấp phát RAM cho Gradle daemon. Với project vừa (1 module + Compose + Hilt +
# Room + KSP), 2GB là đủ. Nếu build chậm hoặc OOM, tăng lên 4GB.
# Dùng -Xmx4g nếu máy >= 16GB RAM và build nhiều module.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Bật Gradle daemon — tăng tốc build lần 2 trở đi
org.gradle.daemon=true

# Build song song các task không phụ thuộc nhau (đa module)
org.gradle.parallel=true

# Cache output của task — tái sử dụng khi input không đổi
org.gradle.caching=true

# Cấu hình on-demand — chỉ config module được gọi, không config hết
org.gradle.configureondemand=true

# Watch file system — phát hiện thay đổi file nhanh hơn (giảm I/O)
org.gradle.vfs.watch=true

# Timeout cho daemon (giây) — tăng nếu mạng chậm khi tải dependency
org.gradle.daemon.idletimeout=10800000

# -----------------------------------------------------------------------------
# 2. Android Gradle Plugin (AGP)
# -----------------------------------------------------------------------------
# Dùng AndroidX (bắt buộc cho Compose, Hilt, Room, Lifecycle)
android.useAndroidX=true

# Tự động migrate các thư viện support cũ sang AndroidX
android.enableJetifier=false

# Bật Non-Transitive R classes — giảm kích thước R class, tăng tốc build
android.nonTransitiveRClass=true

# Bật Non-Final Res IDs — cho phép R8 tối ưu resource tốt hơn
android.nonFinalResIds=true

# Build features: giữ ở dạng opt-in để R8 loại bỏ code không dùng
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# Tắt PNG crunching (đã có aapt2 xử lý) — tăng tốc build
android.enableResourceOptimizations=true

# -----------------------------------------------------------------------------
# 3. R8 / ProGuard
# -----------------------------------------------------------------------------
# R8 Full Mode là DEFAULT từ AGP 8.0+. KHÔNG đặt =false nếu không có lý do.
# Chỉ bật dòng dưới nếu đang dùng AGP < 8.0:
# android.enableR8.fullMode=true

# Tắt R8 cho debug build (không cần thiết vì debug build thường tắt minify)
android.enableR8=true

# -----------------------------------------------------------------------------
# 4. Kotlin
# -----------------------------------------------------------------------------
# Kotlin code style chính thức
kotlin.code.style=official

# Tăng tốc Kotlin compiler daemon
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Bật parallel compilation trong module
kotlin.parallel.tasks.in.project=true

# JVM target cho Kotlin compiler (khớp với app/build.gradle.kts)
kotlin.jvm.target.validation.mode=error

# -----------------------------------------------------------------------------
# 5. KSP (Hilt + Room)
# -----------------------------------------------------------------------------
# KSP incremental — chỉ re-process file thay đổi
ksp.incremental=true
ksp.incremental.intermodule=true
ksp.incremental.log=false

# Cho phép KSP chạy song song với Kotlin compile
ksp.allow.all.target.configuration=true

# -----------------------------------------------------------------------------
# 6. Compose
# -----------------------------------------------------------------------------
# Bật Compose metrics (chỉ bật khi cần phân tích recomposition)
# Tắt để tăng tốc build
android.compose.metricsDestination=build/compose-metrics

# -----------------------------------------------------------------------------
# 7. Non-Transitive R & Jetifier (đã set ở trên, note lại để rõ)
# -----------------------------------------------------------------------------
# - android.nonTransitiveRClass=true    → R class nhỏ hơn, build nhanh hơn
# - android.nonFinalResIds=true         → R8 tối ưu resource tốt hơn
# - android.enableJetifier=false        → KHÔNG dùng support library cũ

# -----------------------------------------------------------------------------
# 8. Build performance tuning
# -----------------------------------------------------------------------------
# Bật R8 trong debug (chỉ khi cần test obfuscation)
# android.enableR8.fullMode=false

# Giới hạn số worker thread — đặt = số core CPU
org.gradle.workers.max=8

# Bật configuration cache (tăng tốc đáng kể cho build lần 2+)
# ⚠️ Một số plugin (Hilt < 2.50, KSP < 1.9) có thể conflict — nếu lỗi thì comment lại
org.gradle.configuration-cache=true

# Cho phép configuration cache fail gracefully (không phá build)
org.gradle.configuration-cache.problems=warn

# -----------------------------------------------------------------------------
# 9. Logging
# -----------------------------------------------------------------------------
# Hiển thị warning của Kotlin/Gradle dạng gọn
org.gradle.warning.mode=all

# -----------------------------------------------------------------------------
# 10. Firebase Crashlytics (đã setup ở câu trước)
# -----------------------------------------------------------------------------
# Tự động upload mapping file khi build release
# Có thể override bằng cờ -PcrashlyticsUploadMappingFile=false
firebase.crashlytics.mappingFileUploadEnabled=true

# Bật NDK crash report (nếu có native code)
firebase.crashlytics.ndkEnabled=false

# -----------------------------------------------------------------------------
# 11. Android SDK paths (thường do local.properties quản lý)
# -----------------------------------------------------------------------------
# KHÔNG đặt sdk.dir ở đây — để local.properties tự set, tránh commit nhầm
# đường dẫn máy cá nhân.